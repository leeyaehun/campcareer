name: Refresh security lockfile

on:
  push:
    branches:
      - cleanup/phase1-reset
    paths:
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/phase1-reset
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Patch production dependencies
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.dependencies.next = '16.3.4'
          pkg.dependencies.sharp = '0.35.4'
          pkg.devDependencies['eslint-config-next'] = '16.3.4'
          pkg.overrides = pkg.overrides || {}
          pkg.overrides['gray-matter'] = {
            ...(pkg.overrides['gray-matter'] || {}),
            'js-yaml': '3.15.2'
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'chore: patch production dependency vulnerabilities'
          git push origin HEAD:cleanup/phase1-reset
